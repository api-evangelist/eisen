aid: eisen
name: Eisen
description: 'Eisen is an AI-enabled compliance operations platform for financial institutions and digital
  asset companies, managing escheatment (unclaimed property), disbursement, customer outreach, and 1099
  tax reporting across all account types. Its product suite includes an Escheatment Manager that tracks
  state compliance deadlines and dormancy rules, a Disbursement Manager that automates personalized customer
  payments, an Outreach Manager that re-engages dormant account holders, and a 1099 Reporting Manager for
  tax reporting. Eisen handles dormant accounts, stale checks, account wind-downs, and forced closures,
  and is backed by Cowboy Ventures, Homebrew, and Index Ventures. As of this profile Eisen exposes no
  public developer API, portal, or documentation; this record captures its identity and public web surface.'
